name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: tag to build, already pushed by the caller
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: resolve tag, owner and latest
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # registry rejects capital letters in the owner; latest only moves to the highest stable tag
        run: |
          highest="$(git tag --list 'v*' --sort=-v:refname | sed '/-/d' | head -n1)"
          {
            echo "tag=${TAG}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minerva-helper-web-app"
            if [ "${highest}" = "${TAG}" ]; then echo 'latest=true'; else echo 'latest=false'; fi
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest == 'true' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
