name: tag

on:
  push:
    branches: [main]

concurrency:
  group: tag-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: tag the version from package.json
        id: tag
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          created=false
          if [ "${tag}" != "v0.0.0" ] && ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${tag}" -m "${tag}"
            git push origin "${tag}"
            created=true
          fi
          {
            echo "tag=${tag}"
            echo "created=${created}"
          } >> "${GITHUB_OUTPUT}"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    # a tag pushed with GITHUB_TOKEN does not trigger release.yml on its own
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
