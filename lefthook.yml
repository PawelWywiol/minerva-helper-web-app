pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,json,jsonc,yaml,yml,toml,css,html}'
      run: pnpm exec oxfmt --check {staged_files}
    - name: js
      glob: 'src/main/resources/web/**/*.js'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    - name: shellcheck
      glob: '*.sh'
      run: pnpm lint:sh
    - name: dockerfile
      glob: 'Dockerfile'
      run: pnpm lint:docker
    - name: secrets
      run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --pre-commit --staged --redact /repo

commit-msg:
  commands:
    'lint commit message':
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: gradle build
      run: pnpm build
    - name: actions
      run: pnpm lint:actions
